name: Mission Control CI

run-name: "${{ github.event_name }} - ${{ inputs.configuration || 'Release' }}"

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:

      configuration:
        description: Build configuration
        type: choice
        options:
          - Release
          - Debug
        default: Release
        required: true

      extra_diagnostics:
        description: Enable extra diagnostics
        type: boolean
        default: false
        required: true

jobs:
  hello:
    runs-on: ubuntu-24.04
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Test .NET&Node
        shell: bash
        run: |
          test -f MissionControl.slnx
          test -f global.json
          test -f .nvmrc
          dotnet --version
          node --version
          npm --version

      - name: Extra diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extra_diagnostics }}
        shell: bash
        env:
          CONFIGURATION: ${{ inputs.configuration || 'Release' }}
        run: |
          echo "Configuration: $CONFIGURATION"
          dotnet --info
          docker version

      - name: Read project files
        shell: bash
        run: |
          pwd
          ls -la