name: Mission Control CI

run-name: "${{ github.event_name }} - ${{ inputs.configuration || 'Release' }}"

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:

      configuration:
        description: Build configuration
        type: choice
        options:
          - Release
          - Debug
        default: Release
        required: true

      extra_diagnostics:
        description: Enable extra diagnostics
        type: boolean
        default: false
        required: true

jobs:
  backend:
    runs-on: ubuntu-24.04

    env:
      CI: true
      BUILD_CONFIGURATION: ${{ inputs.build_configuration || 'Release' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Docker Test
        run: docker version

      - name: Validate lockfiles
        run: |
          # Enable strict mode: exit on errors, undefined variables, and failed commands in pipelines.
          set -euo pipefail
          test -f backend.tests/packages.lock.json
          test -f backend/packages.lock.json
        
      - name: Restore dependencies
        run: dotnet restore --locked-mode
      
      - name: Build
        run: dotnet build --configuration "$BUILD_CONFIGURATION"

      - name: Test
        run: dotnet test --configuration "$BUILD_CONFIGURATION"